<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" role="img"><rect x="1" y="1" width="1098" height="518" rx="24" fill="#fff" stroke="#E6E6E6" stroke-width="2"/><text x="40" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111111" text-anchor="start">Five trust layers</text><path d="M64 115V435" stroke="#E6E6E6" stroke-width="2"/><rect x="40" y="80" width="1020" height="70" rx="14" fill="#F5F5F5" stroke="#F5F5F5" stroke-width="1.5"/><circle cx="64" cy="115" r="16" fill="#2B59FF"/><text x="64" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="100" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start">Pairing and network</text><text x="350" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#111111" text-anchor="start">QR pairing and a device key (stored hashed). Only peers on the same LAN connect.</text><rect x="40" y="160" width="1020" height="70" rx="14" fill="#F5F5F5" stroke="#F5F5F5" stroke-width="1.5"/><circle cx="64" cy="195" r="16" fill="#2B59FF"/><text x="64" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="100" y="201" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start">Permissions</text><text x="350" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#111111" text-anchor="start">Plugins declare permissions in manifest.json. You review them per plugin before install.</text><rect x="40" y="240" width="1020" height="70" rx="14" fill="#F5F5F5" stroke="#F5F5F5" stroke-width="1.5"/><circle cx="64" cy="275" r="16" fill="#2B59FF"/><text x="64" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="100" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start">Plugin sandbox</text><text x="350" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#111111" text-anchor="start">Only react, react-native and @kesh/sdk resolve. Every other import fails.</text><rect x="40" y="320" width="1020" height="70" rx="14" fill="#F5F5F5" stroke="#F5F5F5" stroke-width="1.5"/><circle cx="64" cy="355" r="16" fill="#2B59FF"/><text x="64" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="100" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start">Icon sanitizer</text><text x="350" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#111111" text-anchor="start">icon.svg passes an element and attribute allowlist before it reaches the phone.</text><rect x="40" y="400" width="1020" height="70" rx="14" fill="#F5F5F5" stroke="#F5F5F5" stroke-width="1.5"/><circle cx="64" cy="435" r="16" fill="#2B59FF"/><text x="64" y="441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="100" y="441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start">Claude run</text><text x="350" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#111111" text-anchor="start">Claude is spawned with no tools, in an empty directory.</text></svg>
